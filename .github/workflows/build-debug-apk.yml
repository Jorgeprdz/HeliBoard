name: R2.2 quality gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: R2.2 focal RED or GREEN evidence
        run: ./gradlew :app:testDebugUnitTest --tests 'helium314.keyboard.latin.InputLogicTest.r22*' --tests 'helium314.keyboard.latin.ai.*' --tests 'helium314.keyboard.latin.ai.local.*' --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R22-focal-reports
          path: |
            app/build/reports/tests
            app/build/test-results
