name: Generate approved keyboard launcher icons
on:
  push:
    branches:
      - branding/approved-keyboard-icon-20261015
    paths:
      - "art/launcher_icon/approved_source_512.webp"
      - "scripts/branding/build_launcher_assets.py"
      - ".github/workflows/build-keyboard-icon.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branding branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install generator dependency
        run: python -m pip install Pillow==11.3.0
      - name: Generate legacy and store artwork
        run: python scripts/branding/build_launcher_assets.py
      - name: Commit generated icon resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi art/launcher_icon/play-store-512.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: generate approved launcher icon density files"
            git push
          fi
