name: Test build
# Runs the complete debug unit-test suite without exclusions.

on:
  push:
    branches:
      - feature/ios-glass-keyboard
  pull_request:
    paths:
      - 'app/src/main/java**'
      - 'app/src/main/res/**'
      - 'app/src/main/assets/layouts/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 for Robolectric
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run complete unit-test suite
        run: ./gradlew testDebugUnitTest

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
