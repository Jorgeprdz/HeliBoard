name: Dynamic color schemes CI

on:
  push:
    branches:
      - feature/dynamic-color-schemes
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test dynamic color schemes
        run: ./gradlew clean :app:testDebugUnitTest --tests 'helium314.keyboard.latin.common.dynamic.DynamicColorSchemesTest'

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: dynamic-color-schemes-reports
          path: '*/build/reports'
