name: HeliBoard R2 verified cloud build
on:
  push:
    branches: [feat/heliboard-ai-r2-3-full-auto-cloud]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heliboard-r23-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Allocate monotonic R2.4 Preview update version
        run: echo "HELIBOARD_VERSION_CODE=$((4122 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Validate Termux installer and cleanup syntax and gates
        run: |
          bash -n scripts/termux/heliboard-r23-auto-install.sh
          bash -n scripts/termux/heliboard-r23-clean-clones.sh
          bash -n scripts/termux/heliboard-r22-auto-install.sh
          bash -n scripts/termux/heliboard-r22-clean-clones.sh
          python3 -m unittest discover -s scripts/tests -v
      - name: R2.4 typing and style acceptance gate
        run: ./gradlew :app:testDebugUnitTest --tests '*R24*'
      - name: R2.3 behavioral acceptance gate
        run: ./gradlew :app:testDebugUnitTest --tests '*R23*'
      - name: Complete regression including local documentation paths and live dictionaries
        run: ./gradlew :app:testDebugUnitTest
      - name: Android lint gate
        if: always()
        run: ./gradlew :app:lintDebug
      - name: Restore existing persistent signing identity securely
        env:
          KEY_B64: ${{ secrets.HELIBOARD_R22_SIGNING_KEY_B64 }}
          KEY_PASSWORD: ${{ secrets.HELIBOARD_R22_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64"
          test -n "$KEY_PASSWORD"
          mkdir -m 700 "$RUNNER_TEMP/heliboard-signing"
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/heliboard-signing/heliboard-r2.p12"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/heliboard-signing/signing-password"
          chmod 600 "$RUNNER_TEMP/heliboard-signing/"*
      - name: Assemble only after every automated gate passes
        env:
          HELIBOARD_SIGNING_DIR: ${{ runner.temp }}/heliboard-signing
        run: ./gradlew :app:assembleDebug
      - name: Verify APK integrity, package and checksum; audit certificate identity
        env:
          EXPECTED_CERT: cfea5c3e180245ec7db199a1d8d799a4a91e0454fef7d02c5313b6d923b66ba2
          HELIBOARD_APK_NAME: HeliBoard-R2.4-Typing-Preview-debug.apk
          HELIBOARD_EXPECTED_VERSION_NAME: 4.1-iosglass.8-ai-r24-typing-preview
        run: |
          set -euo pipefail
          mkdir r23-artifact
          mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" r23-artifact/"$HELIBOARD_APK_NAME"
          tools="$ANDROID_HOME/build-tools/37.0.0"
          "$tools/apksigner" verify --print-certs r23-artifact/"$HELIBOARD_APK_NAME" | tee "$RUNNER_TEMP/r22-certificate.txt"
          "$tools/aapt" dump badging r23-artifact/"$HELIBOARD_APK_NAME" > "$RUNNER_TEMP/r22-badging.txt"
          grep -Fx "sdkVersion:'21'" "$RUNNER_TEMP/r22-badging.txt"
          python3 scripts/ci/r23-manifest.py
          (cd r23-artifact && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-R2.4-Typing-Preview-debug-apk
          path: r23-artifact/*
          if-no-files-found: error
          retention-days: 14
      - name: Test and lint evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HeliBoard-R2.4-Typing-Preview-reports
          path: |
            app/build/reports
            app/build/test-results
            ${{ runner.temp }}/r22-certificate.txt
          retention-days: 14
      - name: Remove runner signing files
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/heliboard-signing"; then
            rm -rf -- "$RUNNER_TEMP/heliboard-signing"
          fi
