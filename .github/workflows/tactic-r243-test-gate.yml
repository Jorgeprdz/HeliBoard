name: R243 Android unit regression gate (no APK)
on:
  push:
    branches: [feat/tactic-r243-hybrid-writing]
    paths: ['.github/workflows/tactic-r243-test-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r243-android-regressions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify pure-Java edit contracts
        run: bash experiments/r243/tests/run_android_edit_contract_host.sh
      - name: Run full Android JVM unit suite; fail on any regression
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Preserve XML and HTML results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R243-test-only-regression-evidence
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14
