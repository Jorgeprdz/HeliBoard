name: Tactic R252c owner-signed production release
on:
  push:
    branches: [feat/tactic-r243-hybrid-writing]
    paths:
      - '.github/workflows/tactic-r252c-production.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tactic-r252c-prod-v4-1
  cancel-in-progress: false
jobs:
  release:
    name: Quality gate, owner-signature, production tag
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      HELIBOARD_VERSION_CODE: '20261017'
      HELIBOARD_VERSION_NAME: '4.1-tactic-r252c.1'
      TAG: 'v4.1-tactic-r252c.1'
      APK_NAME: 'Tactic-Keyboard-R252C-PRODUCTION.apk'
      PACKAGE_ID: 'com.jorgeprdz.ioskeyboard'
      EXPECTED_CERT: 'cfea5c3e180245ec7db199a1d8d799a4a91e0454fef7d02c5313b6d923b66ba2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Guard base package, experimental isolation and release opt-in
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts').read_text()
          assert 'applicationId = "com.jorgeprdz.ioskeyboard"' in p
          assert 'if (ownerSigning != null) signingConfig = ownerSigning' in p
          life=Path('app/src/main/java/helium314/keyboard/latin/common/dynamic/R252ColorLifecycle.kt').read_text()
          assert 'refreshActivation(context: Context)' in life
          assert 'R252ReleaseActivationPolicy.enabled' in life
          policy=Path('app/src/main/java/helium314/keyboard/latin/common/dynamic/R252ReleaseActivationPolicy.kt').read_text()
          assert 'userOptIn || (isDebugBuild && debugAdbRequested)' in policy
          defaults=Path('app/src/main/java/helium314/keyboard/latin/settings/Defaults.kt').read_text()
          assert 'PREF_R252_BY_APP_COLORS = false' in defaults
          ui=Path('app/src/main/java/helium314/keyboard/settings/screens/AppearanceScreen.kt').read_text()
          assert 'SwitchPreference(it, Defaults.PREF_R252_BY_APP_COLORS)' in ui
          print('R252C_RELEASE_OPT_IN_STATIC_GATE=PASS')
          PY
          python3 experiments/r243/check_branding.py
          bash experiments/r243/tests/run_android_edit_contract_host.sh
      - name: Full JVM regression, including production activation policy
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert files, 'No JVM XML output'
          n=fail=skip=0; names=set()
          for p in files:
            root=ET.parse(p).getroot()
            n+=int(root.get('tests','0'))
            fail+=int(root.get('failures','0'))+int(root.get('errors','0'))
            skip+=int(root.get('skipped','0'))
            names.add(root.get('name',''))
          assert n>=548 and fail==0 and skip==0, (n,fail,skip)
          assert any(x.endswith('R252ReleaseActivationPolicyTest') for x in names), names
          assert any(x.endswith('R252cDebugSwitchTest') for x in names), names
          print(f'PRODUCTION_JVM_PASS={n}/{n}; skipped=0')
          PY
      - name: Restore persistent owner signing certificate (never printed)
        env:
          KEY_B64: ${{ secrets.HELIBOARD_R22_SIGNING_KEY_B64 }}
          KEY_PASSWORD: ${{ secrets.HELIBOARD_R22_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64" && test -n "$KEY_PASSWORD" || {
            echo 'STOP: owner signing secrets unavailable (no release)' >&2; exit 1;
          }
          install -d -m 700 "$RUNNER_TEMP/tactic-signing"
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/tactic-signing/heliboard-r2.p12"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/tactic-signing/signing-password"
          chmod 600 "$RUNNER_TEMP/tactic-signing/"*
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/writing-source
            ${{ runner.temp }}/writing-host
            ${{ runner.temp }}/writing-arm64
          key: tactic-r252c-production-native-b5046-${{ hashFiles('native-writing/writing.cpp','native-writing/CMakeLists.txt') }}
      - name: Compile existing ARM64 runtime (no writing changes)
        run: bash scripts/ci/build-writing-runtime.sh
      - name: Build one owner-signed release APK
        env:
          HELIBOARD_SIGNING_DIR: ${{ runner.temp }}/tactic-signing
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon
      - name: Check package, version, manifest, release signature, SHA256
        run: |
          set -euo pipefail
          mkdir -p tactic-production
          mapfile -t files < <(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f)
          test "${#files[@]}" -eq 1
          test -s "${files[0]}"
          cp "${files[0]}" "tactic-production/$APK_NAME"
          latest="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$latest/apksigner" verify --print-certs "tactic-production/$APK_NAME" > tactic-production/signer.txt
          "$latest/aapt" dump badging "tactic-production/$APK_NAME" > tactic-production/badging.txt
          "$latest/aapt" dump xmltree "tactic-production/$APK_NAME" AndroidManifest.xml > tactic-production/manifest.txt
          ./gradlew :app:generateReleaseBuildConfig --no-daemon
          python3 - <<'PY'
          from pathlib import Path
          import os,re,hashlib,zipfile,json
          d=Path('tactic-production')
          f=d/os.environ['APK_NAME']
          badging=(d/'badging.txt').read_text()
          signing=(d/'signer.txt').read_text()
          manifest=(d/'manifest.txt').read_text()
          match=re.search(r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'",badging,re.M)
          assert match, 'missing APK package badging'
          assert match.group(1)==os.environ['PACKAGE_ID'], match.groups()
          assert int(match.group(2))==int(os.environ['HELIBOARD_VERSION_CODE'])
          assert match.group(3)==os.environ['HELIBOARD_VERSION_NAME']
          digests=re.findall(r'certificate SHA-256 digest:\s*([a-f0-9]{64})',signing,re.I)
          assert len(digests)>=1 and all(x.lower()==os.environ['EXPECTED_CERT'].lower() for x in digests),digests
          assert 'helium314.keyboard.latin.LatinIME' in manifest
          assert 'android:debuggable' not in manifest or 'android:debuggable(0x0101000f)=(type 0x12)0x0' in manifest
          cfg=[p for p in Path('app/build/generated').rglob('BuildConfig.java') if '/release/' in str(p)]
          assert cfg and any(re.search(r'DEBUG\s*=\s*(?:false|Boolean\.parseBoolean\("false"\))',p.read_text()) for p in cfg)
          with zipfile.ZipFile(f) as z: assert z.testzip() is None
          sha=hashlib.sha256(f.read_bytes()).hexdigest()
          (d/'SHA256SUMS.txt').write_text(f'{sha}  {f.name}\n')
          print('PRODUCTION_APK_SIGNATURE_AND_PACKAGE_PASS', f.name, sha)
          (d/'release-manifest.json').write_text(json.dumps(dict(status='SIGNED_RELEASE_CANDIDATE',
             commit=os.environ['GITHUB_SHA'], package=match.group(1), versionCode=int(match.group(2)),
             certificateSha256=digests[0], apkSha256=sha, byAppDefault='OFF',
             userOptIn='Settings > Appearance', physicalGate='OWNER_REPORTED_PASS',
             previousEmulatorFirstFrameGate='NOT_PROVEN', pr8='DRAFT_NOT_MERGED'),indent=2)+'\n')
          PY
          (cd tactic-production && sha256sum -c SHA256SUMS.txt)
      - name: Upload release APK for traceability
        uses: actions/upload-artifact@v4
        with:
          name: Tactic-R252C-OWNER-SIGNED-production-candidate
          path: tactic-production/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish versioned release after all gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "STOP: release tag already exists; refusing overwrite" >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.txt" <<'NOTES'
          Tactic Keyboard R2.5.2c — owner-signed stable opt-in color source.

          New: Appearance > Dynamic colors by app. Default OFF for user safety.
          The 10 existing dynamic families reuse their current palette engines.
          Unchanged: glass transparency and blur sliders, key geometry, writing engine logic.
          Preserves package com.jorgeprdz.ioskeyboard and owner signing identity.

          Evidence: owner manually verified S25 app switching, families, no visible flicker,
          and text continuity. JVM regression gates required before publishing.
          Known limit: emulator A-B-A OnPreDraw repeat not proven; this release does
          not claim validated first GPU-composed frame or cross-profile universality.

          Source: feat/tactic-r243-hybrid-writing. PR #8 intentionally remains Draft;
          this release does not merge the PR to main.
          NOTES
          gh release create "$TAG" tactic-production/"$APK_NAME" tactic-production/SHA256SUMS.txt \
            tactic-production/release-manifest.json \
            --target "$GITHUB_SHA" --title "Tactic Keyboard R2.5.2c — By App" \
            --notes-file "$RUNNER_TEMP/release-notes.txt" --latest
          gh release view "$TAG" --json url,tagName,assets
      - name: Remove owner keystore, whether passing or failing
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/tactic-signing"
      - name: Upload test reports even if build fails (no false success)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tactic-R252C-Release-QA
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 30
