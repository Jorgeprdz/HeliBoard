name: R252c2 debug switch evidence only (NO APK)
on:
  push:
    branches: [feat/tactic-r243-hybrid-writing]
    paths:
      - '.github/workflows/tactic-r252c2-debug-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test debug OFF default, ADB flag 1 ON, release pure-policy OFF
        run: |
          set -euo pipefail
          mkdir -p r252c2-proof
          ./gradlew :app:testDebugUnitTest \
            --tests 'helium314.keyboard.latin.common.dynamic.R252cDebugSwitchTest' \
            --no-daemon 2>&1 | tee r252c2-proof/debug-tests.log
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          xml=Path('app/build/test-results/testDebugUnitTest/TEST-helium314.keyboard.latin.common.dynamic.R252cDebugSwitchTest.xml')
          assert xml.exists(), "Missing dedicated debug switch test evidence"
          root=ET.parse(xml).getroot()
          count={x:int(root.get(x,'0')) for x in ('tests','failures','errors','skipped')}
          print('R252C2_DEBUG_SWITCH_XML',count)
          assert count==dict(tests=4,failures=0,errors=0,skipped=0),count
          PY
      - name: Verify release constant OFF without building release APK
        run: |
          set -euo pipefail
          ./gradlew :app:generateReleaseBuildConfig --no-daemon 2>&1 | tee r252c2-proof/release-buildconfig.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates=[p for p in Path('app/build/generated').rglob('BuildConfig.java') if '/release/' in str(p)]
          assert candidates, 'BuildConfig for release not generated'
          pattern=r'DEBUG\s*=\s*(?:false|Boolean\.parseBoolean\("false"\))'
          assert any(re.search(pattern,p.read_text()) for p in candidates),candidates
          source=Path('app/src/main/java/helium314/keyboard/latin/common/dynamic/R252cDebugSwitch.kt').read_text()
          assert 'if (!BuildConfig.DEBUG) return false' in source
          gradle=Path('app/build.gradle.kts').read_text()
          assert 'release {' in gradle and 'isMinifyEnabled = true' in gradle
          (Path('r252c2-proof')/'release-evidence.txt').write_text(
             'RELEASE_BUILDCONFIG_DEBUG_FALSE=PASS\nRELEASE_SWITCH_READ_PATH=COMPILE_TIME_UNREACHABLE\n'
             'RELEASE_APK=NOT_BUILT\nRELEASE_DEX_CLASS_ABSENCE=NOT_PROVEN\n')
          print('RELEASE_BUILDCONFIG_DEBUG_FALSE=PASS; RELEASE_APK=NOT_BUILT')
          PY
      - name: Upload proof only, never product or release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tactic-R252C2-DebugSwitch-Only-Proof-NO-APK
          path: |
            r252c2-proof/
            app/build/test-results/testDebugUnitTest/TEST-helium314.keyboard.latin.common.dynamic.R252cDebugSwitchTest.xml
          if-no-files-found: warn
          retention-days: 14
