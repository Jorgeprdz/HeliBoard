name: Tactic R2.6 intelligent writing and GIF verification
on:
  push:
    branches: [feat/gifs-and-automatic-gemini]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tactic-r26-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      HELIBOARD_VERSION_CODE: '20261109'
      HELIBOARD_VERSION_NAME: '4.1-tactic-r26.2-gif-panel-emojis'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Preserve approved appearance and identity
        run: |
          git fetch --depth=1 origin 9451fa9a7ab7994e32c5cbb1b13b8914d741a290
          python3 scripts/ci/check-r26-appearance.py
      - name: Full JVM regression and Android lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache :app:testDebugUnitTest :app:lintDebug
      - name: Validate every bundled emoji dictionary and real keyword mappings
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, time, urllib.request
          manifest = json.loads(pathlib.Path('tools/emoji-dictionaries/provenance.json').read_text())
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'emoji-dicttool.jar'
          for attempt in range(3):
              try:
                  payload = urllib.request.urlopen(manifest['builder']['url'], timeout=60).read()
                  assert hashlib.sha256(payload).hexdigest() == manifest['builder']['sha256']
                  target.write_bytes(payload)
                  break
              except Exception:
                  if attempt == 2:
                      raise
                  time.sleep(2)
          environment = dict(os.environ, DICTTOOL_JAR=str(target))
          subprocess.run(['python3', 'tools/emoji-dictionaries/test_dictionary_assets.py'], env=environment, check=True)
          PY
      - name: Unchanged optional local writing runtime from pinned source
        run: bash scripts/ci/build-writing-runtime.sh
      - name: Restore owner signing identity
        env:
          KEY_B64: ${{ secrets.HELIBOARD_R22_SIGNING_KEY_B64 }}
          KEY_PASSWORD: ${{ secrets.HELIBOARD_R22_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64" && test -n "$KEY_PASSWORD"
          install -d -m 700 "$RUNNER_TEMP/tactic-signing"
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/tactic-signing/heliboard-r2.p12"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/tactic-signing/signing-password"
          chmod 600 "$RUNNER_TEMP/tactic-signing/"*
          echo "HELIBOARD_SIGNING_DIR=$RUNNER_TEMP/tactic-signing" >> "$GITHUB_ENV"
      - name: Assemble signed update
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease
      - name: Verify release runtime initialization and reflective constructors
        run: python3 scripts/ci/check-r26-runtime.py
      - name: Verify package, version and certificate
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp app/build/outputs/apk/release/*.apk delivery/Tactic-R26-intelligent-gifs.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs delivery/Tactic-R26-intelligent-gifs.apk > delivery/certificate.txt
          grep -F 'cfea5c3e180245ec7db199a1d8d799a4a91e0454fef7d02c5313b6d923b66ba2' delivery/certificate.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging delivery/Tactic-R26-intelligent-gifs.apk > delivery/package.txt
          grep -F "name='com.jorgeprdz.ioskeyboard'" delivery/package.txt
          grep -F "versionCode='20261109'" delivery/package.txt
          (cd delivery && sha256sum Tactic-R26-intelligent-gifs.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Tactic-R26-signed-update
          path: delivery/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tactic-R26-verification-reports
          path: |
            app/build/reports
            app/build/test-results
      - name: Remove temporary signing material
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/tactic-signing"; then rm -rf -- "$RUNNER_TEMP/tactic-signing"; fi
