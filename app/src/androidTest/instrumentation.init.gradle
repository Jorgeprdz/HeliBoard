// Test-only opt-in; leaves the approved production Gradle/identity bytes untouched.
gradle.beforeProject { project ->
    // Only the product module owns debugNoMinify. R252c editor fixtures have plain debug.
    if (project.path != ":app") return
    project.plugins.withId("com.android.application") {
        def android = project.extensions.getByName("android")
        android.defaultConfig.testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        android.testBuildType = "debugNoMinify"
        project.dependencies.add("androidTestImplementation", "androidx.test:runner:1.7.0")
        project.dependencies.add("androidTestImplementation", "androidx.test.ext:junit:1.3.0")
    }
}
